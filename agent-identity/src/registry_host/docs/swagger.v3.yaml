components:
  schemas:
    enums.AgentRole:
      enum:
      - clone
      - human
      - expert
      - facilitator
      type: string
      x-enum-varnames:
      - AgentRoleClone
      - AgentRoleHuman
      - AgentRoleExpert
      - AgentRoleFacilitator
    errors.NotFoundError:
      properties:
        message:
          type: string
      type: object
    errors.ValidationError:
      properties:
        field:
          type: string
        message:
          type: string
      type: object
    requests.AgentByIdRequest:
      properties:
        agentId:
          type: string
        authenticatedWallet:
          form: authenticatedWallet
          type: string
      type: object
    responses.AgentCollectionResponse:
      properties:
        address:
          type: string
        name:
          type: string
        symbol:
          type: string
      type: object
    responses.AgentResponse:
      properties:
        attributes:
          additionalProperties:
            type: string
          type: object
        cloneOf:
          type: integer
        collectionAddress:
          type: string
        collectionTokenId:
          type: integer
        creator:
          type: string
        databaseSetupStatus:
          type: string
        ensDomain:
          type: string
        id:
          type: string
        images:
          additionalProperties:
            type: string
          type: object
        isInternal:
          type: boolean
        isSetupCompleted:
          type: boolean
        llmSetupStatus:
          type: string
        name:
          type: string
        owner:
          type: string
        proposalId:
          type: integer
        role:
          $ref: '#/components/schemas/enums.AgentRole'
        walletAddress:
          type: string
      type: object
    responses.CreateAgentSecondStepResponse:
      properties:
        nonce:
          type: string
        signature:
          type: string
        signer:
          type: string
      type: object
    responses.IsInternalAgentResponse:
      properties:
        isInternalAgent:
          type: boolean
      type: object
    responses.ListAgentsResponse:
      properties:
        agents:
          items:
            $ref: '#/components/schemas/responses.AgentResponse'
          type: array
          uniqueItems: false
        elementsPerPage:
          type: integer
        page:
          type: integer
        totalElements:
          type: integer
      type: object
  securitySchemes:
    BearerAuth:
      in: header
      name: Authorization
      type: apiKey
externalDocs:
  description: ""
  url: ""
info:
  description: This is the API documentation for the Agent Identity Registry.
  title: Agent Identity Registry API
  version: "1.0"
openapi: 3.1.0
paths:
  /agent-collections:
    get:
      description: Retrieves all available agent collections
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/responses.AgentCollectionResponse'
                type: array
          description: OK
        "500":
          content:
            application/json:
              schema:
                type: string
          description: Internal Server Error
      summary: List agent collections
      tags:
      - AgentCollection
  /agent/{agentCollectionAddress}/{agentCollectionTokenId}:
    get:
      description: Retrieves details of a specific agent by collection address and
        token ID
      parameters:
      - description: Agent collection address
        in: path
        name: agentCollectionAddress
        required: true
        schema:
          type: string
      - description: Agent collection token ID
        in: path
        name: agentCollectionTokenId
        required: true
        schema:
          type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.AgentResponse'
          description: OK
        "500":
          content:
            application/json:
              schema:
                type: string
          description: Internal Server Error
      summary: Get agent
      tags:
      - Agent
  /agent/{agentCollectionAddress}/{agentCollectionTokenId}/is-internal:
    get:
      description: Checks whether a specific agent is an internal agent
      parameters:
      - description: Agent collection address
        in: path
        name: agentCollectionAddress
        required: true
        schema:
          type: string
      - description: Agent collection token ID
        in: path
        name: agentCollectionTokenId
        required: true
        schema:
          type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.IsInternalAgentResponse'
          description: OK
        "500":
          content:
            application/json:
              schema:
                type: string
          description: Internal Server Error
      summary: Check if agent is internal
      tags:
      - Agent
  /agent/create/first-step:
    post:
      description: Uploads agent image and creates agent metadata as the first step
        of agent creation
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              oneOf:
              - title: authenticatedWallet
                type: string
              - title: collectionAddress
                type: string
              - title: name
                type: string
              - title: role
                type: string
              - title: mission
                type: string
              - title: walletAddress
                type: string
              - title: cloneOfAgentId
                type: integer
              - title: image
                type: file
          multipart/form-data:
            schema:
              type: object
        description: Authenticated wallet address | Collection address | Agent name
          | Agent role | Agent mission | Agent wallet address | ID of agent to clone
          | Agent image
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.AgentResponse'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errors.ValidationError'
          description: Bad Request
        "500":
          content:
            application/json:
              schema:
                type: string
          description: Internal Server Error
      summary: Start agent creation
      tags:
      - Agent
  /agent/create/second-step:
    post:
      description: Completes agent creation by generating the mint signature
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/requests.AgentByIdRequest'
                description: Agent ID and authenticated wallet
                summary: request
        description: Agent ID and authenticated wallet
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.CreateAgentSecondStepResponse'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errors.ValidationError'
          description: Bad Request
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errors.NotFoundError'
          description: Not Found
        "500":
          content:
            application/json:
              schema:
                type: string
          description: Internal Server Error
      summary: Complete agent creation
      tags:
      - Agent
  /agent/ens/{ensDomain}:
    get:
      description: Retrieves a minted agent by its ENS domain name
      parameters:
      - description: ENS domain name
        in: path
        name: ensDomain
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.AgentResponse'
          description: OK
        "404":
          content:
            application/json:
              schema:
                type: string
          description: Agent not found
        "500":
          content:
            application/json:
              schema:
                type: string
          description: Internal Server Error
      summary: Get agent by ENS domain
      tags:
      - Agent
  /agents:
    get:
      description: Retrieves a paginated list of agents with optional filtering
      parameters:
      - description: Page number
        in: query
        name: page
        schema:
          type: integer
      - description: Elements per page
        in: query
        name: elementsPerPage
        schema:
          type: integer
      - description: Sort direction (asc, desc)
        in: query
        name: sortDirection
        schema:
          type: string
      - description: Sort by field
        in: query
        name: sortBy
        schema:
          type: string
      - description: Filter by internal status
        in: query
        name: isInternal
        schema:
          type: boolean
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ListAgentsResponse'
          description: OK
        "500":
          content:
            application/json:
              schema:
                type: string
          description: Internal Server Error
      summary: List agents
      tags:
      - Agent
servers:
- url: /
