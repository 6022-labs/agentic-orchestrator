components:
  schemas:
    errors.BadRequestError:
      properties:
        code:
          type: string
        message:
          type: string
      type: object
    errors.InternalError:
      properties:
        code:
          type: string
        message:
          type: string
      type: object
    errors.NotFoundError:
      properties:
        code:
          type: string
        message:
          type: string
      type: object
    errors.ValidationError:
      properties:
        field:
          type: string
        message:
          type: string
      type: object
    responses.AgentCollectionResponse:
      properties:
        address:
          type: string
        name:
          type: string
        symbol:
          type: string
      type: object
    responses.AgentResponse:
      properties:
        addresses:
          additionalProperties:
            type: string
          type: object
        attributes:
          additionalProperties:
            type: string
          type: object
        cloneOf:
          type: integer
        collectionAddress:
          type: string
        collectionTokenId:
          type: integer
        creator:
          type: string
        ensDomain:
          type: string
        id:
          type: string
        images:
          additionalProperties:
            type: string
          type: object
        name:
          type: string
        owner:
          type: string
        proposalId:
          type: integer
      type: object
    responses.ListAgentsResponse:
      properties:
        agents:
          items:
            $ref: '#/components/schemas/responses.AgentResponse'
          type: array
          uniqueItems: false
        elementsPerPage:
          type: integer
        page:
          type: integer
        totalElements:
          type: integer
      type: object
  securitySchemes:
    BearerAuth:
      in: header
      name: Authorization
      type: apiKey
externalDocs:
  description: ""
  url: ""
info:
  description: This is the API documentation for the Agent Identity Registry.
  title: Agent Identity Registry API
  version: "1.0"
openapi: 3.1.0
paths:
  /agent-collections:
    get:
      description: Retrieves all available agent collections
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/responses.AgentCollectionResponse'
                type: array
          description: OK
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errors.InternalError'
          description: internal_error
      summary: List agent collections
      tags:
      - AgentCollection
  /agent/{agentCollectionAddress}/{agentCollectionTokenId}:
    get:
      description: Retrieves details of a specific agent by collection address and
        token ID
      parameters:
      - description: Agent collection address
        in: path
        name: agentCollectionAddress
        required: true
        schema:
          type: string
      - description: Agent collection token ID
        in: path
        name: agentCollectionTokenId
        required: true
        schema:
          type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.AgentResponse'
          description: OK
        "400":
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/errors.ValidationError'
                - $ref: '#/components/schemas/errors.BadRequestError'
          description: invalid_params
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errors.NotFoundError'
          description: agent_not_found
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errors.InternalError'
          description: internal_error
      summary: Get agent
      tags:
      - Agent
  /agent/ens/{ensDomain}:
    get:
      description: Retrieves a minted agent by its ENS domain name
      parameters:
      - description: ENS domain name
        in: path
        name: ensDomain
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.AgentResponse'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errors.BadRequestError'
          description: invalid_params
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errors.NotFoundError'
          description: agent_not_found
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errors.InternalError'
          description: internal_error
      summary: Get agent by ENS domain
      tags:
      - Agent
  /agents:
    get:
      description: Retrieves a paginated list of agents with optional filtering
      parameters:
      - description: Page number
        in: query
        name: page
        schema:
          type: integer
      - description: Elements per page
        in: query
        name: elementsPerPage
        schema:
          type: integer
      - description: Sort direction (asc, desc)
        in: query
        name: sortDirection
        schema:
          type: string
      - description: Sort by field
        in: query
        name: sortBy
        schema:
          type: string
      - description: Filter on mint state (true = minted only, false = proposals only)
        in: query
        name: isMinted
        schema:
          type: boolean
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ListAgentsResponse'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errors.BadRequestError'
          description: invalid_query
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errors.InternalError'
          description: internal_error
      summary: List agents
      tags:
      - Agent
servers:
- url: /
