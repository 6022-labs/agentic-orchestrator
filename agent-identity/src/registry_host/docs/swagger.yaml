basePath: /
definitions:
  enums.AgentRole:
    enum:
    - clone
    - human
    - expert
    - facilitator
    type: string
    x-enum-varnames:
    - AgentRoleClone
    - AgentRoleHuman
    - AgentRoleExpert
    - AgentRoleFacilitator
  responses.AgentCollectionResponse:
    properties:
      address:
        type: string
      name:
        type: string
      symbol:
        type: string
    type: object
  responses.AgentResponse:
    properties:
      addresses:
        additionalProperties:
          type: string
        type: object
      attributes:
        additionalProperties:
          type: string
        type: object
      cloneOf:
        type: integer
      collectionAddress:
        type: string
      collectionTokenId:
        type: integer
      creator:
        type: string
      ensDomain:
        type: string
      id:
        type: string
      images:
        additionalProperties:
          type: string
        type: object
      name:
        type: string
      owner:
        type: string
      proposalId:
        type: integer
      role:
        $ref: '#/definitions/enums.AgentRole'
    type: object
  responses.ListAgentsResponse:
    properties:
      agents:
        items:
          $ref: '#/definitions/responses.AgentResponse'
        type: array
      elementsPerPage:
        type: integer
      page:
        type: integer
      totalElements:
        type: integer
    type: object
info:
  contact: {}
  description: This is the API documentation for the Agent Identity Registry.
  title: Agent Identity Registry API
  version: "1.0"
paths:
  /agent-collections:
    get:
      description: Retrieves all available agent collections
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/responses.AgentCollectionResponse'
            type: array
        "500":
          description: Internal Server Error
          schema:
            type: string
      summary: List agent collections
      tags:
      - AgentCollection
  /agent/{agentCollectionAddress}/{agentCollectionTokenId}:
    get:
      description: Retrieves details of a specific agent by collection address and
        token ID
      parameters:
      - description: Agent collection address
        in: path
        name: agentCollectionAddress
        required: true
        type: string
      - description: Agent collection token ID
        in: path
        name: agentCollectionTokenId
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/responses.AgentResponse'
        "500":
          description: Internal Server Error
          schema:
            type: string
      summary: Get agent
      tags:
      - Agent
  /agent/ens/{ensDomain}:
    get:
      description: Retrieves a minted agent by its ENS domain name
      parameters:
      - description: ENS domain name
        in: path
        name: ensDomain
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/responses.AgentResponse'
        "404":
          description: Agent not found
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            type: string
      summary: Get agent by ENS domain
      tags:
      - Agent
  /agents:
    get:
      description: Retrieves a paginated list of agents with optional filtering
      parameters:
      - description: Page number
        in: query
        name: page
        type: integer
      - description: Elements per page
        in: query
        name: elementsPerPage
        type: integer
      - description: Sort direction (asc, desc)
        in: query
        name: sortDirection
        type: string
      - description: Sort by field
        in: query
        name: sortBy
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/responses.ListAgentsResponse'
        "500":
          description: Internal Server Error
          schema:
            type: string
      summary: List agents
      tags:
      - Agent
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
