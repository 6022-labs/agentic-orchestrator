services:
  gateway-host:
    build:
      context: ./gateway
      dockerfile: ./src/orchestrator_gateway_host/Dockerfile
    container_name: orchestrator-gateway-host
    ports:
      - "5000:5000"
    environment:
      - API_PORT=5000
      - APP_NAME=AgenticAI-Orchestrator-API-Core
      - DATABASE_URL=host=db port=5432 user=postgres password=root dbname=orchestrator sslmode=disable
      - VAULT_ADDR=http://vault:8200
      - VAULT_TOKEN=wBGKZCJjfIGqIKB3HMmvcQVt
      - VAULT_KV_V1_MOUNT_PATH=secret
      - REDIS_HOST=redis:6379
      - REDIS_DB=0
      - REDIS_PASSWORD=
      - JWT_HASH=dev-secret
      - JWT_LIVING_TIME=86400
      - CHAIN_ID=80002
      - PUBLIC_KEY=0x99065eCD99aE9fBA4dC467C1588b9205Aa71Aa16
      - TOKEN_6022_SMART_CONTRACT_ADDRESS=0x26adaf578361953e8F1aC86D3e4Ca153493af5cB
      - AGENTIC_AI_AGENT_COLLECTION_SMART_CONTRACT_ADDRESS=0xB895417AcC1E84cC544e2BA9AB2b4493569B6F62
      - AGENT_COLLECTION_SIGNING_DOMAIN=AgenticAIAgentCollection
      - RPC_NODE_WS_URL=ws://evm-node:8545
      - RPC_NODE_HTTP_URL=http://evm-node:8545
      - ENS_RPC_NODE_HTTP_URL=http://evm-node:8545
      - AGENT_LLM_CONNECTOR_BASE_URL=http://agent-llm-connector-host:5000
      - AGENT_DATABASE_CONNECTOR_BASE_URL=http://agent-database-connector-host:5000
      - IMAGE_GENERATOR_BASE_URL=http://images-generator-host:5000
      - IPFS_NODE_HTTP_URL=http://kubo:5001
      - SLACK_BRIDGE_URL=http://slack-bridge-internal-host:3000
    networks:
      orchestrator-network:
    depends_on:
      db:
        condition: service_healthy
      vault:
        condition: service_started
      redis:
        condition: service_started
      evm-node:
        condition: service_started
      kubo:
        condition: service_started
      agent-llm-connector-host:
        condition: service_started
      agent-database-connector-host:
        condition: service_started
      images-generator-host:
        condition: service_started
      slack-bridge-internal-host:
        condition: service_started

  sc-watcher-host:
    build:
      context: ./gateway
      dockerfile: ./src/orchestrator_sc_sync_host/Dockerfile
    container_name: orchestrator-sc-sync-host
    ports:
      - "3001:3000"
    environment:
      - USE_API=true
      - USE_LISTENERS=true
      - API_PORT=3000
      - APP_NAME=AgenticAI-Orchestrator-SC-Sync-Watcher
      - DATABASE_URL=host=db port=5432 user=postgres password=root dbname=orchestrator sslmode=disable
      - CHAIN_ID=80002
      - AGENT_COLLECTION_SIGNING_DOMAIN=AgentCollection
      - AGENT_COLLECTIONS_MANAGER_SMART_CONTRACT_ADDRESS=0x39DD75a025145770a8b8278Cc8BA705116443Ea7
      - PUBLIC_KEY=0x39019dbffbebd8766afbd091c2857d40659b1b52
      - RPC_NODE_WS_URL=ws://evm-node:8545
      - RPC_NODE_HTTP_URL=http://evm-node:8545
      - ENS_RPC_NODE_HTTP_URL=http://evm-node:8545
      - VAULT_ADDR=http://vault:8200
      - VAULT_TOKEN=wBGKZCJjfIGqIKB3HMmvcQVt
      - VAULT_KV_V1_MOUNT_PATH=secret
    networks:
      orchestrator-network:
    depends_on:
      db:
        condition: service_healthy
      evm-node:
        condition: service_started
      vault:
        condition: service_started

  agent-llm-connector-host:
    build:
      context: ./agent-reasoning
      dockerfile: ./src/llm_connector_host/Dockerfile
    container_name: orchestrator-agent-llm-connector-host
    ports:
      - "5002:5000"
    environment:
      - DATABASE_URL=host=db port=5432 user=postgres password=root dbname=orchestrator sslmode=disable
      - API_PORT=5000
      - APP_NAME=AgenticAI-Orchestrator-Agent-LLM-Connector-API
      - VAULT_ADDR=http://vault:8200
      - VAULT_TOKEN=wBGKZCJjfIGqIKB3HMmvcQVt
      - VAULT_KV_V1_MOUNT_PATH=secret
    networks:
      orchestrator-network:
    depends_on:
      db:
        condition: service_healthy
      vault:
        condition: service_started

  agent-database-connector-host:
    build:
      context: ./agent-knowledge
      dockerfile: ./src/database_connector_host/Dockerfile
    container_name: orchestrator-agent-database-connector-host
    ports:
      - "5003:5000"
    environment:
      - DATABASE_URL=host=db port=5432 user=postgres password=root dbname=orchestrator sslmode=disable
      - API_PORT=5000
      - APP_NAME=AgenticAI-Orchestrator-Agent-Database-Connector-API
      - VAULT_ADDR=http://vault:8200
      - VAULT_TOKEN=wBGKZCJjfIGqIKB3HMmvcQVt
      - VAULT_KV_V1_MOUNT_PATH=secret
    networks:
      orchestrator-network:
    depends_on:
      db:
        condition: service_healthy
      vault:
        condition: service_started

  images-generator-host:
    build:
      context: ./agent-identity
      dockerfile: ./src/images_generator_host/Dockerfile
    container_name: orchestrator-images-generator-host
    ports:
      - "5004:5000"
    environment:
      - API_PORT=5000
      - APP_NAME=Orchestrator-Images-Generator
      - IMAGE_GENERATION_IMAGE_MARK_PATH=/images/nft_mark.png
    networks:
      orchestrator-network:

  slack-bridge-internal-host:
    build:
      context: ./channels-and-integrations/slack-bridge
      dockerfile: ./src/slack_bridge_internal_host/Dockerfile
    container_name: orchestrator-slack-bridge-internal-host
    ports:
      - "5101:3000"
    environment:
      - DATABASE_URL=host=db port=5432 user=postgres password=root dbname=orchestrator sslmode=disable
      - API_PORT=3000
      - APP_NAME=AgenticAI-Orchestrator-API-Core
      - REDIS_HOST=redis:6379
      - REDIS_DB=0
      - REDIS_PASSWORD=
      - VAULT_ADDR=http://vault:8200
      - VAULT_TOKEN=wBGKZCJjfIGqIKB3HMmvcQVt
      - VAULT_KV_V1_MOUNT_PATH=secret
      - PUBLIC_KEY=0x99065eCD99aE9fBA4dC467C1588b9205Aa71Aa16
      - SLACK_API_BASE_URL=https://slack.com
      - SLACK_CLIENT_SECRET=change-me
      - SLACK_SIGNING_SECRET=change-me
      - SLACK_BOT_TOKEN=xoxb-change-me
      - SLACK_ICON_PROVIDER_URL_TEMPLATE=https://ipfs.io/ipfs/%s
      - ORCHESTRATOR_API_BASE_URL=http://gateway-host:5000
    networks:
      orchestrator-network:
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      vault:
        condition: service_started

  slack-bridge-external-host:
    build:
      context: ./channels-and-integrations/slack-bridge
      dockerfile: ./src/slack_bridge_external_host/Dockerfile
    container_name: orchestrator-slack-bridge-external-host
    ports:
      - "5102:3000"
    environment:
      - DATABASE_URL=host=db port=5432 user=postgres password=root dbname=orchestrator sslmode=disable
      - API_PORT=3000
      - APP_NAME=AgenticAI-Orchestrator-API-Core
      - REDIS_HOST=redis:6379
      - REDIS_DB=0
      - REDIS_PASSWORD=
      - VAULT_ADDR=http://vault:8200
      - VAULT_TOKEN=wBGKZCJjfIGqIKB3HMmvcQVt
      - VAULT_KV_V1_MOUNT_PATH=secret
      - PUBLIC_KEY=0x99065eCD99aE9fBA4dC467C1588b9205Aa71Aa16
      - SLACK_API_BASE_URL=https://slack.com
      - SLACK_CLIENT_SECRET=change-me
      - SLACK_SIGNING_SECRET=change-me
      - SLACK_BOT_TOKEN=xoxb-change-me
      - SLACK_ICON_PROVIDER_URL_TEMPLATE=https://ipfs.io/ipfs/%s
      - ORCHESTRATOR_API_BASE_URL=http://gateway-host:5000
      - ORCHESTRATOR_FRONT_BASE_URL=http://web-ui:3000
    networks:
      orchestrator-network:
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      vault:
        condition: service_started

  web-ui:
    build:
      context: ./ui
      dockerfile: ./Dockerfile
      args:
        VITE_APP_KIT_PROJECT_ID: ""
        VITE_ENVIRONMENT: local
        VITE_ORCHESTRATOR_GATEWAY_API_BASE_URL: http://gateway-host:5000
        VITE_SCANNER_BASE_URL: https://polygonscan.com
        VITE_OPENSEA_VIEW_URL_TEMPLATE: https://opensea.io/item/matic/{collection}/{tokenId}
        VITE_RARIBLE_VIEW_URL_TEMPLATE: https://rarible.com/token/polygon/{collection}:{tokenId}
        VITE_IPFS_GATEWAY: http://kubo:8080/ipfs/
        VITE_AGENT_COLLECTION_CREATOR_ADDRESS: 0x99065eCD99aE9fBA4dC467C1588b9205Aa71Aa16
        VITE_AGENT_COLLECTIONS_MANAGER_ADDRESS: 0x39DD75a025145770a8b8278Cc8BA705116443Ea7
        VITE_CHAIN_ID: "80002"
    container_name: orchestrator-web-ui
    ports:
      - "3000:80"
    networks:
      orchestrator-network:
    depends_on:
      gateway-host:
        condition: service_started

  db:
    image: "postgres:16-alpine"
    container_name: orchestrator-db
    environment:
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "root"
      POSTGRES_DB: "orchestrator"
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 5s
      retries: 10
    networks:
      orchestrator-network:
    volumes:
      - db-data:/var/lib/postgresql/data

  pgadmin:
    image: "dpage/pgadmin4"
    container_name: orchestrator-pgadmin
    user: "root"
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: "pgadmin4@pgadmin.org"
      PGADMIN_DEFAULT_PASSWORD: "root"
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    networks:
      orchestrator-network:
    volumes:
      - ./pgadmin-servers.json:/pgadmin4/servers.json

  vault:
    image: hashicorp/vault:1.18
    container_name: orchestrator-vault
    ports:
      - "8200:8200"
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: "wBGKZCJjfIGqIKB3HMmvcQVt"
    volumes:
      - vault-data:/vault/file
    networks:
      orchestrator-network:
    command: >
      /bin/sh -c "
      vault server -dev -dev-listen-address=0.0.0.0:8200 -dev-root-token-id=wBGKZCJjfIGqIKB3HMmvcQVt &
      sleep 5 &&
      VAULT_ADDR=http://127.0.0.1:8200 VAULT_TOKEN=wBGKZCJjfIGqIKB3HMmvcQVt vault secrets disable secret &&
      VAULT_ADDR=http://127.0.0.1:8200 VAULT_TOKEN=wBGKZCJjfIGqIKB3HMmvcQVt vault secrets enable -version=1 -path=secret kv &&
      wait"

  redis:
    image: "redis:alpine"
    container_name: orchestrator-redis
    ports:
      - "6379:6379"
    networks:
      orchestrator-network:

  evm-node:
    image: ghcr.io/foundry-rs/foundry:v1.0.0
    container_name: orchestrator-evm-node
    ports:
      - "8545:8545"
    environment:
      - ANVIL_IP_ADDR=0.0.0.0
    volumes:
      - evm-node-data:/data
    user: "root"
    entrypoint: sh -c "anvil --state-interval 5 --dump-state /data/state.json $( [ -f /data/state.json ] && echo '--load-state /data/state.json' )"
    networks:
      orchestrator-network:

  kubo:
    image: ipfs/kubo:v0.34.1
    container_name: orchestrator-kubo
    ports:
      - "4001:4001"
      - "5001:5001"
      - "8080:8080"
      - "9090:9090"
    networks:
      orchestrator-network:

networks:
  orchestrator-network:
    name: orchestrator-network

volumes:
  db-data:
  vault-data:
  evm-node-data:
