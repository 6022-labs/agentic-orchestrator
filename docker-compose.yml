services:
  gateway-host:
    build:
      context: ./gateway
      dockerfile: ./src/gateway_host/Dockerfile
    container_name: gateway-host
    ports:
      - "5000:5000"
    environment:
      - TELEMETRY__ENABLED=true
      - TELEMETRY__ENDPOINT=orchestrator-alloy:4317
      - TELEMETRY__INSECURE=true
      - TELEMETRY__INSTANCE_ID=gateway-1
      - TELEMETRY__ENVIRONMENT=local
      - HOST__API_PORT=5000
      - REDIS__HOST=redis:6379
      - REDIS__DB=0
      - REDIS__PASSWORD=
      - JWT__HASH=dev-secret
      - JWT__LIVING_TIME=86400
      - AGENT_IDENTITY_REGISTRY__BASE_URL=http://registry-host:5000
      - CONVERSATION_BROKER__BASE_URL=http://conversation-broker-host:3000
      - BLOCKCHAIN__EVM_CHAINS__80002__COLLECTIONS_MANAGER_ADDRESS=0x39DD75a025145770a8b8278Cc8BA705116443Ea7
      - BLOCKCHAIN__EVM_CHAINS__80002__COLLECTION_CREATOR_ADDRESS=0x99065eCD99aE9fBA4dC467C1588b9205Aa71Aa16
      - PLATFORM_BRIDGES__SLACK_BRIDGE__BASE_URL=http://slack-bridge-internal-host:3000
    networks:
      orchestrator-network:
    depends_on:
      redis:
        condition: service_started
      registry-host:
        condition: service_started
      conversation-broker-host:
        condition: service_started
      slack-bridge-internal-host:
        condition: service_started

  registry-synchronizer-host:
    build:
      context: ./agent-identity
      dockerfile: ./src/registry_synchronizer_host/Dockerfile
    container_name: registry-synchronizer-host
    environment:
      - TELEMETRY__ENABLED=true
      - TELEMETRY__ENDPOINT=orchestrator-alloy:4317
      - TELEMETRY__INSECURE=true
      - TELEMETRY__INSTANCE_ID=registry-synchronizer-1
      - TELEMETRY__ENVIRONMENT=local
      - DATABASE__URL=host=db port=5432 user=postgres password=root dbname=orchestrator sslmode=disable
      - BLOCKCHAIN__CHAIN_ID=80002
      - AGENT_COLLECTIONS_MANAGER__SMART_CONTRACT_ADDRESS=0x39DD75a025145770a8b8278Cc8BA705116443Ea7
      - DECENTRALIZED_DOMAIN_NAME_PROVIDER__DOMAIN_EXTENSION=eth
      - RPC_NODE__WS_URL=ws://evm-node:8545
      - RPC_NODE__HTTP_URL=http://evm-node:8545
      - RPC_NODE__REQUEST_TIMEOUT_SECONDS=10
      - SYNC__START_BLOCK=1
      - SYNC__BLOCK_FINALIZATION_DELAY=2s
    networks:
      orchestrator-network:
    depends_on:
      db:
        condition: service_healthy
      evm-node:
        condition: service_started

  registry-host:
    build:
      context: ./agent-identity
      dockerfile: ./src/registry_host/Dockerfile
    container_name: registry-host
    ports:
      - "5005:5000"
    environment:
      - TELEMETRY__ENABLED=true
      - TELEMETRY__ENDPOINT=orchestrator-alloy:4317
      - TELEMETRY__INSECURE=true
      - TELEMETRY__INSTANCE_ID=registry-1
      - TELEMETRY__ENVIRONMENT=local
      - HOST__API_PORT=5000
      - DATABASE__URL=host=db port=5432 user=postgres password=root dbname=orchestrator sslmode=disable
    networks:
      orchestrator-network:
    depends_on:
      db:
        condition: service_healthy

  conversation-broker-host:
    build:
      context: ./agent-swarm
      dockerfile: ./src/conversation_broker_host/Dockerfile
    container_name: conversation-broker-host
    ports:
      - "5004:3000"
    environment:
      - TELEMETRY__ENABLED=true
      - TELEMETRY__ENDPOINT=orchestrator-alloy:4317
      - TELEMETRY__INSECURE=true
      - TELEMETRY__INSTANCE_ID=conversation-broker-1
      - TELEMETRY__ENVIRONMENT=local
      - HOST__API_PORT=3000
      - DATABASE__URL=host=db port=5432 user=postgres password=root dbname=orchestrator sslmode=disable
      - AGENT_IDENTITY_REGISTRY__BASE_URL=http://registry-host:5000
      - BLOCKCHAIN__CHAIN_ID=80002
      - RPC_NODE__HTTP_URL=http://evm-node:8545
      - RPC_NODE__REQUEST_TIMEOUT_SECONDS=10
      # - AGENT_ENS_REGISTRY__SMART_CONTRACT_ADDRESS=
      - REMOTE_AGENT__REQUEST_TIMEOUT_SECONDS=120
      - REMOTE_AGENT_RESOLUTION__CACHE_TTL_SECONDS=300
      - REGISTRY_AGENT_RESOLUTION__CACHE_TTL_SECONDS=120
      - REDIS__HOST=redis:6379
      - REDIS__DB=0
      - REDIS__PASSWORD=
      - WALLET__PRIVATE_KEY=0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80
    networks:
      orchestrator-network:
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      registry-host:
        condition: service_started
      evm-node:
        condition: service_started

  slack-bridge-internal-host:
    build:
      context: ./channels-and-integrations/slack-bridge
      dockerfile: ./src/slack_bridge_internal_host/Dockerfile
    container_name: slack-bridge-internal-host
    ports:
      - "5101:3000"
    environment:
      - TELEMETRY__ENABLED=true
      - TELEMETRY__ENDPOINT=orchestrator-alloy:4317
      - TELEMETRY__INSECURE=true
      - TELEMETRY__INSTANCE_ID=slack-bridge-internal-1
      - TELEMETRY__ENVIRONMENT=local
      - HOST__API_PORT=3000
      - DATABASE__URL=host=db port=5432 user=postgres password=root dbname=orchestrator sslmode=disable
      - REDIS__HOST=redis:6379
      - REDIS__DB=0
      - REDIS__PASSWORD=
      - SLACK__APP_ID=change-me
      - SLACK__CLIENT_SECRET=change-me
      - SLACK__SIGNING_SECRET=change-me
      - SLACK__BOT_TOKEN=xoxb-change-me
      - CONVERSATION_BROKER__BASE_URL=http://conversation-broker-host:3000
      - CONVERSATION_BROKER__CALLBACK_URL=http://slack-bridge-internal-host:3000
      - CONVERSATION_BROKER__BRIDGE_ID=1b2c3d4e-5555-4666-8777-888899990000
    networks:
      orchestrator-network:
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      conversation-broker-host:
        condition: service_started

  slack-bridge-external-host:
    build:
      context: ./channels-and-integrations/slack-bridge
      dockerfile: ./src/slack_bridge_external_host/Dockerfile
    container_name: slack-bridge-external-host
    ports:
      - "5102:3000"
    environment:
      - TELEMETRY__ENABLED=true
      - TELEMETRY__ENDPOINT=orchestrator-alloy:4317
      - TELEMETRY__INSECURE=true
      - TELEMETRY__INSTANCE_ID=slack-bridge-external-1
      - TELEMETRY__ENVIRONMENT=local
      - HOST__API_PORT=3000
      - DATABASE__URL=host=db port=5432 user=postgres password=root dbname=orchestrator sslmode=disable
      - REDIS__HOST=redis:6379
      - REDIS__DB=0
      - REDIS__PASSWORD=
      - SLACK__APP_ID=change-me
      - SLACK__CLIENT_SECRET=change-me
      - SLACK__SIGNING_SECRET=change-me
      - SLACK__BOT_TOKEN=xoxb-change-me
      - AGENT_IDENTITY_REGISTRY__BASE_URL=http://registry-host:5000
      - VERIFY_WALLET_OWNERSHIP__ORCHESTRATOR_FRONT_BASE_URL=http://localhost:3000
      - CONVERSATION_BROKER__BASE_URL=http://conversation-broker-host:3000
      - CONVERSATION_BROKER__CALLBACK_URL=http://slack-bridge-internal-host:3000
      - CONVERSATION_BROKER__BRIDGE_ID=1b2c3d4e-5555-4666-8777-888899990000
    networks:
      orchestrator-network:
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  web-ui:
    build:
      context: ./web
      dockerfile: ./Dockerfile
      args:
        VITE_APP_KIT_PROJECT_ID: ""
        VITE_ENVIRONMENT: local
        VITE_IPFS_GATEWAY: https://ipfs.io/ipfs/
    container_name: web-ui
    ports:
      - "3000:80"
    networks:
      orchestrator-network:
    depends_on:
      gateway-host:
        condition: service_started

  db:
    image: "postgres:18-alpine"
    container_name: db
    environment:
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "root"
      POSTGRES_DB: "orchestrator"
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 5s
      retries: 10
    networks:
      orchestrator-network:
    volumes:
      - db-data:/var/lib/postgresql/data

  pgadmin:
    image: "dpage/pgadmin4:9.17"
    container_name: pgadmin
    user: "root"
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: "pgadmin4@pgadmin.org"
      PGADMIN_DEFAULT_PASSWORD: "root"
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    networks:
      orchestrator-network:
    volumes:
      - ./pgadmin-servers.json:/pgadmin4/servers.json

  redis:
    image: "redis:8-alpine"
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      orchestrator-network:

  evm-node:
    image: ghcr.io/foundry-rs/foundry:v1.7.1
    container_name: evm-node
    ports:
      - "8545:8545"
    environment:
      - ANVIL_IP_ADDR=0.0.0.0
    volumes:
      - evm-node-data:/data
    user: "root"
    entrypoint: sh -c "anvil --state-interval 5 --dump-state /data/state.json $( [ -f /data/state.json ] && echo '--load-state /data/state.json' )"
    networks:
      orchestrator-network:

  # Observability stack: Alloy (OTLP) -> Mimir + Loki + Tempo, shown in Grafana.
  orchestrator-alloy:
    build: ./grafana/alloy
    container_name: orchestrator-alloy
    environment:
      - LOKI_URL=http://orchestrator-loki:3100
      - MIMIR_URL=http://orchestrator-mimir:9009
      - TEMPO_OTLP_URL=http://orchestrator-tempo:4318
      # Ingest auth is off by default. htpasswd (one credential per sender, `$$` escaped) wins
      # over token (one shared by every sender).
      # - OTLP_AUTH_HTPASSWD=ingest-user:secret
      # - OTLP_AUTH_TOKEN=shared-secret
      # - OTLP_TLS_CERT_FILE=/certs/alloy.crt
      # - OTLP_TLS_KEY_FILE=/certs/alloy.key
      # - OTLP_TLS_CLIENT_CA_FILE=/certs/ca.crt
    ports:
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
    networks:
      orchestrator-network:

  orchestrator-mimir:
    image: "grafana/mimir:3.2.0"
    container_name: orchestrator-mimir
    command: ["--config.file=/etc/mimir/mimir.yml", "--target=all"]
    volumes:
      - ./grafana/mimir/mimir-config.yaml:/etc/mimir/mimir.yml
      - orchestrator-mimir-data:/mimir-data
    ports:
      - "9009:9009"
    networks:
      orchestrator-network:

  orchestrator-loki:
    image: "grafana/loki:3.7.6"
    container_name: orchestrator-loki
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes:
      - ./grafana/loki/loki-config.yaml:/etc/loki/loki.yaml
      - orchestrator-loki-data:/loki
    ports:
      - "3100:3100"
    networks:
      orchestrator-network:

  orchestrator-tempo:
    image: "grafana/tempo:3.0.3"
    container_name: orchestrator-tempo
    depends_on:
      - orchestrator-mimir
    command: ["-config.file=/etc/tempo/tempo.yml"]
    volumes:
      - ./grafana/tempo/tempo-config.yaml:/etc/tempo/tempo.yml
      - orchestrator-tempo-data:/var/tempo
    ports:
      - "3200:3200"
    networks:
      orchestrator-network:

  orchestrator-grafana:
    image: "grafana/grafana:13.2.0"
    container_name: orchestrator-grafana
    depends_on:
      - orchestrator-mimir
      - orchestrator-loki
      - orchestrator-tempo
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      # Local dev only; this stack is not meant to be exposed.
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      MIMIR_URL: "http://orchestrator-mimir:9009"
      LOKI_URL: "http://orchestrator-loki:3100"
      TEMPO_URL: "http://orchestrator-tempo:3200"
    ports:
      - "3001:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    networks:
      orchestrator-network:


networks:
  orchestrator-network:
    name: orchestrator-network

volumes:
  db-data:
  evm-node-data:
  orchestrator-mimir-data:
  orchestrator-loki-data:
  orchestrator-tempo-data:
