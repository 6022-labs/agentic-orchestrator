basePath: /
definitions:
  requests.PostBrokerCompletionToSlackRequest:
    properties:
      collectionAddress:
        type: string
      collectionTokenId:
        type: integer
      content:
        type: string
      conversationId:
        type: string
    type: object
  requests.SetWalletOwnershipToSlackUserRequest:
    properties:
      challenge:
        type: string
      walletAddress:
        type: string
    type: object
info:
  contact: {}
  description: This is the API documentation for the Slack Bridge Internal Host.
  title: Slack Bridge Internal API
  version: "1.0"
paths:
  /internal/broker/callback:
    post:
      consumes:
      - application/json
      description: Receives an agent completion from the conversation broker and posts
        it to the originating Slack thread.
      parameters:
      - description: Broker callback payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/requests.PostBrokerCompletionToSlackRequest'
      produces:
      - text/plain
      responses:
        "204":
          description: No Content
          schema:
            type: string
        "400":
          description: Bad Request
          schema:
            type: string
        "404":
          description: Not Found
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            type: string
      summary: Conversation broker completion callback
      tags:
      - BrokerCallback
  /wallet/set-ownership-to-slack-user:
    post:
      consumes:
      - application/json
      description: Confirms wallet ownership for a Slack user by providing a signed
        challenge
      parameters:
      - description: Wallet ownership verification
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/requests.SetWalletOwnershipToSlackUserRequest'
      produces:
      - text/plain
      responses:
        "200":
          description: OK
          schema:
            type: string
        "400":
          description: Bad Request
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            type: string
      summary: Set wallet ownership to Slack user
      tags:
      - Wallet
swagger: "2.0"
