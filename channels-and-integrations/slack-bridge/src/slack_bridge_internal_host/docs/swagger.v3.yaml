components:
  schemas:
    requests.PostBrokerCompletionToSlackRequest:
      properties:
        collectionAddress:
          type: string
        collectionTokenId:
          type: integer
        content:
          type: string
        conversationId:
          type: string
      type: object
    requests.SetWalletOwnershipToSlackUserRequest:
      properties:
        challenge:
          type: string
        walletAddress:
          type: string
      type: object
externalDocs:
  description: ""
  url: ""
info:
  description: This is the API documentation for the Slack Bridge Internal Host.
  title: Slack Bridge Internal API
  version: "1.0"
openapi: 3.1.0
paths:
  /broker/callback:
    post:
      description: Receives an agent completion from the conversation broker and posts
        it to the originating Slack thread.
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/requests.PostBrokerCompletionToSlackRequest'
                description: Broker callback payload
                summary: request
        description: Broker callback payload
        required: true
      responses:
        "204":
          content:
            text/plain:
              schema:
                type: string
          description: No Content
        "400":
          content:
            text/plain:
              schema:
                type: string
          description: Bad Request
        "404":
          content:
            text/plain:
              schema:
                type: string
          description: Not Found
        "500":
          content:
            text/plain:
              schema:
                type: string
          description: Internal Server Error
      summary: Conversation broker completion callback
      tags:
      - BrokerCallback
  /wallet/set-ownership-to-slack-user:
    post:
      description: Confirms wallet ownership for a Slack user by providing a signed
        challenge
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/requests.SetWalletOwnershipToSlackUserRequest'
                description: Wallet ownership verification
                summary: request
        description: Wallet ownership verification
        required: true
      responses:
        "200":
          content:
            text/plain:
              schema:
                type: string
          description: OK
        "400":
          content:
            text/plain:
              schema:
                type: string
          description: Bad Request
        "500":
          content:
            text/plain:
              schema:
                type: string
          description: Internal Server Error
      summary: Set wallet ownership to Slack user
      tags:
      - Wallet
servers:
- url: /
