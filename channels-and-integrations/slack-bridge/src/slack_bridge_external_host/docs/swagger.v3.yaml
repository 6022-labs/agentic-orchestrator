components: {}
externalDocs:
  description: ""
  url: ""
info:
  description: This is the API documentation for the Slack Bridge External Host.
  title: Slack Bridge External API
  version: "1.0"
openapi: 3.1.0
paths:
  /command-handler/add-agent-to-channel:
    post:
      description: Handles the Slack command to add an agent to a channel by collection
        address and token ID
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              oneOf:
              - type: string
              - title: channel_id
                type: string
              - title: text
                type: string
              - title: user_id
                type: string
        description: 'Slack channel ID | Command text: [collection address] [token
          ID] | Slack user ID'
        required: true
      responses:
        "200":
          content:
            text/plain:
              schema:
                type: string
          description: 'Ephemeral reply: success, usage hint on malformed text, or
            failure notice'
        "400":
          content:
            text/plain:
              schema:
                type: string
          description: Invalid request body
        "500":
          content:
            text/plain:
              schema:
                type: string
          description: Internal Server Error
      summary: Add agent to channel
      tags:
      - Command
  /command-handler/list-agents-in-channel:
    post:
      description: Handles the Slack command to list all agents in a channel
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              oneOf:
              - type: string
              - title: channel_id
                type: string
              - title: text
                type: string
              - title: user_id
                type: string
        description: Slack channel ID | Command text | Slack user ID
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                type: string
          description: JSON list of agents, or failure notice
        "400":
          content:
            application/json:
              schema:
                type: string
          description: Invalid request body
        "500":
          content:
            application/json:
              schema:
                type: string
          description: Internal Server Error
      summary: List agents in channel
      tags:
      - Command
  /command-handler/pair-slack-user-to-human-agent:
    post:
      description: Handles the Slack command to pair a Slack user with a human agent
        by collection address and token ID
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              oneOf:
              - type: string
              - title: channel_id
                type: string
              - title: text
                type: string
              - title: user_id
                type: string
        description: 'Slack channel ID | Command text: [slack user ID] [collection
          address] [token ID] | Slack user ID'
        required: true
      responses:
        "200":
          content:
            text/plain:
              schema:
                type: string
          description: 'Ephemeral reply: success, usage hint on malformed text, or
            failure notice'
        "400":
          content:
            text/plain:
              schema:
                type: string
          description: Invalid request body
        "500":
          content:
            text/plain:
              schema:
                type: string
          description: Internal Server Error
      summary: Pair Slack user to human agent
      tags:
      - Command
  /command-handler/remove-agent-from-channel:
    post:
      description: Handles the Slack command to remove an agent from a channel by
        collection address and token ID
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              oneOf:
              - type: string
              - title: channel_id
                type: string
              - title: text
                type: string
              - title: user_id
                type: string
        description: 'Slack channel ID | Command text: [collection address] [token
          ID] | Slack user ID'
        required: true
      responses:
        "200":
          content:
            text/plain:
              schema:
                type: string
          description: 'Ephemeral reply: success, usage hint on malformed text, or
            failure notice'
        "400":
          content:
            text/plain:
              schema:
                type: string
          description: Invalid request body
        "500":
          content:
            text/plain:
              schema:
                type: string
          description: Internal Server Error
      summary: Remove agent from channel
      tags:
      - Command
  /command-handler/verify-wallet-ownership:
    post:
      description: Handles the Slack command to initiate wallet ownership verification
        for a user
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              oneOf:
              - type: string
              - title: channel_id
                type: string
              - title: text
                type: string
              - title: user_id
                type: string
        description: Slack channel ID | Command text | Slack user ID
        required: true
      responses:
        "200":
          content:
            text/plain:
              schema:
                type: string
          description: Verification response, or failure notice
        "400":
          content:
            text/plain:
              schema:
                type: string
          description: Invalid request body
        "500":
          content:
            text/plain:
              schema:
                type: string
          description: Internal Server Error
      summary: Verify wallet ownership
      tags:
      - Command
  /event-handler:
    post:
      description: Receives and dispatches Slack event callbacks including messages,
        channel events, and URL verification
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - additionalProperties: {}
                title: request
                type: object
        description: Slack event payload
        required: true
      responses:
        "200":
          content:
            text/plain:
              schema:
                type: string
          description: OK
        "400":
          content:
            text/plain:
              schema:
                type: string
          description: Bad Request
        "500":
          content:
            text/plain:
              schema:
                type: string
          description: Internal Server Error
      summary: Handle Slack event
      tags:
      - Event
servers:
- url: /
