basePath: /
definitions:
  enums.AgentContextMessagePlatform:
    enum:
    - none
    - slack
    type: string
    x-enum-varnames:
    - AgentContextMessagePlatformNone
    - AgentContextMessagePlatformSlack
  enums.AgentContextMessageRole:
    enum:
    - user
    - system
    - assistant
    type: string
    x-enum-varnames:
    - AgentContextMessageRoleUser
    - AgentContextMessageRoleSystem
    - AgentContextMessageRoleAssistant
  enums.AgentPromptTemplateKey:
    enum:
    - clone-system
    - clone-default
    - facilitator-system
    - facilitator-default
    - facilitator-conclude
    - expert-system
    - expert-context-found
    - expert-context-not-found
    type: string
    x-enum-varnames:
    - AgentPromptTemplateKeyCloneSystem
    - AgentPromptTemplateKeyCloneDefault
    - AgentPromptTemplateKeyFacilitatorSystem
    - AgentPromptTemplateKeyFacilitatorDefault
    - AgentPromptTemplateKeyFacilitatorConclude
    - AgentPromptTemplateKeyExpertSystem
    - AgentPromptTemplateKeyExpertContextFound
    - AgentPromptTemplateKeyExpertContextNotFound
  enums.DatabaseConnectionDriver:
    enum:
    - mysql
    - mariadb
    - postgres
    type: string
    x-enum-varnames:
    - DatabaseConnectionDriverMySQL
    - DatabaseConnectionDriverMariaDB
    - DatabaseConnectionDriverPostgres
  enums.DatabaseConnectionSetupStatus:
    enum:
    - copying
    - configured
    - established
    - establishing
    type: string
    x-enum-varnames:
    - DatabaseConnectionSetupStatusCopying
    - DatabaseConnectionSetupStatusConfigured
    - DatabaseConnectionSetupStatusEstablished
    - DatabaseConnectionSetupStatusEstablishing
  errors.ValidationError:
    properties:
      field:
        type: string
      message:
        type: string
    type: object
  requests.AddMessagesToAgentContextRequest:
    properties:
      agentId:
        type: string
      contextKey:
        description: You can add messages to a context from a context key or a conversation
          id
        type: string
      conversationId:
        type: string
      messages:
        items:
          $ref: '#/definitions/requests.Message'
        type: array
    type: object
  requests.AgentIdRequest:
    properties:
      agentId:
        type: string
    type: object
  requests.CreateAgentContextRequest:
    properties:
      agentId:
        type: string
      key:
        type: string
    type: object
  requests.CreateDatabaseConnectionRequest:
    properties:
      agentId:
        type: string
      driver:
        $ref: '#/definitions/enums.DatabaseConnectionDriver'
      host:
        type: string
      port:
        type: integer
    type: object
  requests.GetAgentContextsSortBy:
    enum:
    - key
    type: string
    x-enum-varnames:
    - GetAgentContextsSortByKey
  requests.LinkConversationToAgentContextRequest:
    properties:
      agentId:
        type: string
      conversationId:
        type: string
      key:
        type: string
    type: object
  requests.Message:
    properties:
      author:
        type: string
      content:
        type: string
      conversationId:
        description: Not the same goal as the conversation id below.
        type: string
      platform:
        $ref: '#/definitions/enums.AgentContextMessagePlatform'
      role:
        $ref: '#/definitions/enums.AgentContextMessageRole'
    type: object
  requests.SaveAgentPromptTemplateRequest:
    properties:
      agentId:
        type: string
      content:
        type: string
      key:
        $ref: '#/definitions/enums.AgentPromptTemplateKey'
    type: object
  requests.SetupAgentDatabaseRequest:
    properties:
      agentId:
        type: string
      copyFromAgentId:
        type: string
    type: object
  requests.SortDirection:
    enum:
    - asc
    - desc
    type: string
    x-enum-varnames:
    - SortDirectionAsc
    - SortDirectionDesc
  responses.CreateDatabaseConnectionResponse:
    properties:
      databaseName:
        type: string
      databasePassword:
        type: string
      databaseUsername:
        type: string
    type: object
  responses.GetAgentContextMessageResponse:
    properties:
      agentContextId:
        type: string
      author:
        type: string
      content:
        type: string
      conversationId:
        type: string
      createdAt:
        type: string
      hash:
        type: string
      platform:
        $ref: '#/definitions/enums.AgentContextMessagePlatform'
      role:
        $ref: '#/definitions/enums.AgentContextMessageRole'
    type: object
  responses.GetAgentContextResponse:
    properties:
      id:
        type: string
      key:
        type: string
    type: object
  responses.GetDatabaseConnectionSetupStatusResponse:
    properties:
      isCompleted:
        type: boolean
      setupStatus:
        $ref: '#/definitions/enums.DatabaseConnectionSetupStatus'
    type: object
  responses.GetLinkedAgentContextOfConversationResponse:
    properties:
      id:
        type: string
      key:
        type: string
      status:
        $ref: '#/definitions/responses.GetLinkedAgentContextOfConversationResponseStatus'
    type: object
  responses.GetLinkedAgentContextOfConversationResponseStatus:
    enum:
    - not-found
    - found
    type: string
    x-enum-varnames:
    - GetLinkedAgentContextOfConversationResponseStatusNotFound
    - GetLinkedAgentContextOfConversationResponseStatusFound
info:
  contact: {}
  description: This is the API documentation for the Orchestrator Agent Database Connector.
  title: Orchestrator Agent Database Connector Host API
  version: "1.0"
paths:
  /agent/{agentId}/context/{key}:
    get:
      consumes:
      - application/json
      description: Retrieves a specific agent context by key for the specified agent
      parameters:
      - description: Agent ID
        in: path
        name: agentId
        required: true
        type: string
      - description: Context Key
        in: path
        name: key
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/responses.GetAgentContextResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/errors.ValidationError'
        "404":
          description: Not Found
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            type: string
      summary: Get agent context by key
      tags:
      - AgentContext
  /agent/{agentId}/contexts:
    get:
      consumes:
      - application/json
      description: Retrieves the keys of the agent context for the specified agent
      parameters:
      - description: Agent ID
        in: path
        name: agentId
        required: true
        type: string
      - in: query
        name: search
        type: string
      - enum:
        - key
        in: query
        name: sortBy
        type: string
        x-enum-varnames:
        - GetAgentContextsSortByKey
      - enum:
        - asc
        - desc
        in: query
        name: sortDirection
        type: string
        x-enum-varnames:
        - SortDirectionAsc
        - SortDirectionDesc
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/responses.GetAgentContextResponse'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/errors.ValidationError'
        "500":
          description: Internal Server Error
          schema:
            type: string
      summary: Get agent context keys
      tags:
      - AgentContext
  /agent/context:
    post:
      consumes:
      - application/json
      description: Creates a new agent context for the specified agent
      parameters:
      - description: Create Agent Context Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/requests.CreateAgentContextRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            type: string
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/errors.ValidationError'
        "500":
          description: Internal Server Error
          schema:
            type: string
      summary: Create agent context
      tags:
      - AgentContext
  /agent/context/link-conversation:
    post:
      consumes:
      - application/json
      description: Links a conversation to an agent context
      parameters:
      - description: Link Conversation to Agent Context Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/requests.LinkConversationToAgentContextRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: string
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/errors.ValidationError'
        "500":
          description: Internal Server Error
          schema:
            type: string
      summary: Link conversation to agent context
      tags:
      - AgentContext
  /agent/context/linked-conversation:
    get:
      consumes:
      - application/json
      description: Retrieves the linked agent context of a conversation
      parameters:
      - in: query
        name: agentId
        type: string
      - in: query
        name: conversationId
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/responses.GetLinkedAgentContextOfConversationResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/errors.ValidationError'
        "500":
          description: Internal Server Error
          schema:
            type: string
      summary: Get linked agent context of conversation
      tags:
      - AgentContext
  /agent/context/messages:
    get:
      consumes:
      - application/json
      description: Retrieves messages from the agent context for the specified agent
      parameters:
      - in: query
        name: agentId
        type: string
      - in: query
        name: key
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/responses.GetAgentContextMessageResponse'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/errors.ValidationError'
        "500":
          description: Internal Server Error
          schema:
            type: string
      summary: Get agent context messages
      tags:
      - AgentContextMessage
    post:
      consumes:
      - application/json
      description: Adds a message to the agent context for the specified agent
      parameters:
      - description: Add Message To Agent Context Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/requests.AddMessagesToAgentContextRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            type: string
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/errors.ValidationError'
        "500":
          description: Internal Server Error
          schema:
            type: string
      summary: Add message to agent context
      tags:
      - AgentContextMessage
  /agent/prompt/template:
    get:
      consumes:
      - application/json
      description: Retrieves agent prompt templates for the specified agent
      parameters:
      - description: Agent ID
        in: query
        name: agentId
        required: true
        type: string
      - description: Template Key
        in: query
        name: templateKey
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema: {}
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/errors.ValidationError'
        "500":
          description: Internal Server Error
          schema:
            type: string
      summary: Get agent prompt templates
      tags:
      - AgentPromptTemplate
    post:
      consumes:
      - application/json
      description: Saves a new agent prompt template for the specified agent
      parameters:
      - description: Save Agent Prompt Template Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/requests.SaveAgentPromptTemplateRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            type: string
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/errors.ValidationError'
        "500":
          description: Internal Server Error
          schema:
            type: string
      summary: Save agent prompt template
      tags:
      - AgentPromptTemplate
  /database/connection:
    delete:
      consumes:
      - application/json
      description: Deletes an existing database connection for the specified agent
      parameters:
      - description: Remove Database Connection Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/requests.AgentIdRequest'
      produces:
      - application/json
      responses:
        "204":
          description: No Content
          schema:
            type: string
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/errors.ValidationError'
        "500":
          description: Internal Server Error
          schema:
            type: string
      summary: Remove a database connection
      tags:
      - DatabaseConnection
    post:
      consumes:
      - application/json
      description: Creates a new database connection for the specified agent
      parameters:
      - description: Create Database Connection Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/requests.CreateDatabaseConnectionRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/responses.CreateDatabaseConnectionResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/errors.ValidationError'
        "500":
          description: Internal Server Error
          schema:
            type: string
      summary: Create a new database connection
      tags:
      - DatabaseConnection
  /database/connection/setup:
    post:
      consumes:
      - application/json
      description: Sets up the database for the specified agent
      parameters:
      - description: Setup Agent Database Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/requests.SetupAgentDatabaseRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: string
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/errors.ValidationError'
        "500":
          description: Internal Server Error
          schema:
            type: string
      summary: Setup agent database
      tags:
      - DatabaseConnection
  /database/connection/setup-status:
    get:
      consumes:
      - application/json
      description: Retrieves the setup status of the database connection for the specified
        agent
      parameters:
      - in: query
        name: agentId
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/responses.GetDatabaseConnectionSetupStatusResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/errors.ValidationError'
        "500":
          description: Internal Server Error
          schema:
            type: string
      summary: Get database connection setup status
      tags:
      - DatabaseConnection
swagger: "2.0"
