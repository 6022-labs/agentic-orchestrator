name: Go Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.5"
          cache-dependency-path: |
            agent-identity/go.sum
            agent-knowledge/go.sum
            agent-reasoning/go.sum
            channels-and-integrations/slack-bridge/go.sum
            gateway/go.sum

      - name: Initialize Go workspace
        run: |
          go work init \
            ./agent-identity \
            ./agent-knowledge \
            ./agent-reasoning \
            ./channels-and-integrations/slack-bridge \
            ./gateway

      - name: Build all workspace modules
        run: go build ./...
