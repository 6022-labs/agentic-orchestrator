name: Go Build

on:
  push:
    branches:
      - main
    paths:
      - "agent-identity/**"
      - "agent-swarm/**"
      - "channels-and-integrations/slack-bridge/**"
      - "gateway/**"
      - ".golangci.yml"
      - ".github/workflows/go-build.yml"
  pull_request:
    paths:
      - "agent-identity/**"
      - "agent-swarm/**"
      - "channels-and-integrations/slack-bridge/**"
      - "gateway/**"
      - ".golangci.yml"
      - ".github/workflows/go-build.yml"

concurrency:
  group: go-build-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  # Lists the modules whose files changed, so the matrix skips the others.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      modules: ${{ steps.filter.outputs.changes }}

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Detect changed modules
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            agent-identity:
              - "agent-identity/**"
              - &golangci ".golangci.yml"
              - &workflow ".github/workflows/go-build.yml"
            agent-swarm:
              - "agent-swarm/**"
              - *golangci
              - *workflow
            channels-and-integrations/slack-bridge:
              - "channels-and-integrations/slack-bridge/**"
              - *golangci
              - *workflow
            gateway:
              - "gateway/**"
              - *golangci
              - *workflow

  build:
    needs: changes
    if: needs.changes.outputs.modules != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.changes.outputs.modules) }}

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26.2"
          cache: false

      # Sole writer of each module's Go cache: parallel jobs saving the same key race and waste the upload.
      - name: Cache Go modules and build cache
        uses: actions/cache@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-1.26.2-${{ matrix.module }}-${{ hashFiles(format('{0}/go.sum', matrix.module)) }}
          restore-keys: |
            ${{ runner.os }}-go-1.26.2-${{ matrix.module }}-

      - name: Build
        working-directory: ${{ matrix.module }}
        run: go build ./...
