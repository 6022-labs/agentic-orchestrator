name: UI Build

on:
  push:
    branches:
      - main
    paths:
      - "ui/**"
      - ".github/workflows/ui-build.yml"
  pull_request:
    branches:
      - main
    paths:
      - "ui/**"
      - ".github/workflows/ui-build.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build UI
        run: npm run build
