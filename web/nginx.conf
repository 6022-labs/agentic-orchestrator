# Web console at /, gateway proxied behind /api (prefix stripped); nginx-image template filled at container start.
server {
    listen 80;
    server_name _;

    root /var/www/html;
    index index.html;

    # Re-resolves the gateway host, whose address can change when it redeploys.
    resolver ${NGINX_LOCAL_RESOLVERS} valid=10s;

    location / {
        try_files $uri /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # A variable proxy_pass can't strip the prefix, so rewrite does: /api/health -> /health.
    location /api/ {
        set $gateway_base_url ${GATEWAY__BASE_URL};
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $gateway_base_url;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Mirrors the gateway's HOST__BODY_LIMIT_BYTES (4 MiB).
        client_max_body_size 4m;
    }
}
