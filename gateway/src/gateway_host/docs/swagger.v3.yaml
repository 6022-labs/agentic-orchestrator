components:
  schemas:
    enums.AgentRole:
      enum:
      - clone
      - human
      - expert
      - facilitator
      type: string
      x-enum-varnames:
      - AgentRoleClone
      - AgentRoleHuman
      - AgentRoleExpert
      - AgentRoleFacilitator
    enums.BridgePlatform:
      enum:
      - slack
      type: string
      x-enum-varnames:
      - BridgePlatformSlack
    errors.NotFoundError:
      properties:
        message:
          type: string
      type: object
    errors.ValidationError:
      properties:
        field:
          type: string
        message:
          type: string
      type: object
    requests.SaveAgentPromptTemplateRequest:
      properties:
        content:
          type: string
      type: object
    requests.VerifyAuthRequest:
      properties:
        address:
          type: string
        nonce:
          type: string
        signature:
          type: string
      type: object
    requests.VerifyWalletForBridgeRequest:
      properties:
        challenge:
          type: string
        platform:
          $ref: '#/components/schemas/enums.BridgePlatform'
        signature:
          type: string
      type: object
    responses.AgentCardEndpointsResponse:
      properties:
        chatCompletions:
          type: string
        responses:
          type: string
      type: object
    responses.AgentCardResponse:
      properties:
        endpoints:
          $ref: '#/components/schemas/responses.AgentCardEndpointsResponse'
        ensDomain:
          type: string
        name:
          type: string
        paymentMethods:
          items:
            type: string
          type: array
          uniqueItems: false
        protocol:
          type: string
        protocolVersion:
          type: string
      type: object
    responses.AgentCollectionResponse:
      properties:
        address:
          type: string
        name:
          type: string
        symbol:
          type: string
      type: object
    responses.AgentPromptTemplateResponse:
      properties:
        collectionAddress:
          type: string
        collectionTokenId:
          type: integer
        content:
          type: string
        key:
          type: string
      type: object
    responses.AgentResponse:
      properties:
        attributes:
          additionalProperties:
            type: string
          type: object
        cloneOf:
          type: integer
        collectionAddress:
          type: string
        collectionTokenId:
          type: integer
        creator:
          type: string
        ensDomain:
          type: string
        id:
          type: string
        images:
          additionalProperties:
            type: string
          type: object
        name:
          type: string
        owner:
          type: string
        proposalId:
          type: integer
        role:
          $ref: '#/components/schemas/enums.AgentRole'
        walletAddress:
          type: string
      type: object
    responses.BlockchainConfigResponse:
      properties:
        evmChains:
          additionalProperties:
            $ref: '#/components/schemas/responses.EvmChainConfig'
          type: object
      type: object
    responses.BrokerConversationResponse:
      properties:
        bridgeId:
          type: string
        concludedAt:
          type: string
        createdAt:
          type: string
        description:
          type: string
        id:
          type: string
        status:
          type: string
        updatedAt:
          type: string
      type: object
    responses.BrokerMessageResponse:
      properties:
        content:
          type: string
        conversationId:
          type: string
        createdAt:
          type: string
        id:
          type: string
        participantId:
          type: string
      type: object
    responses.BrokerParticipantResponse:
      properties:
        collectionAddress:
          type: string
        collectionTokenId:
          type: integer
        displayName:
          type: string
        ensDomain:
          type: string
        id:
          type: string
        role:
          type: string
      type: object
    responses.EvmChainConfig:
      properties:
        collectionCreatorAddress:
          type: string
        collectionsManagerAddress:
          type: string
      type: object
    responses.GetAuthChallengeResponse:
      properties:
        expiresAt:
          type: string
        nonce:
          type: string
      type: object
    responses.ListAgentsResponse:
      properties:
        agents:
          items:
            $ref: '#/components/schemas/responses.AgentResponse'
          type: array
          uniqueItems: false
        elementsPerPage:
          type: integer
        page:
          type: integer
        totalElements:
          type: integer
      type: object
    responses.ListBrokerConversationsResponse:
      properties:
        conversations:
          items:
            $ref: '#/components/schemas/responses.BrokerConversationResponse'
          type: array
          uniqueItems: false
        elementsPerPage:
          type: integer
        page:
          type: integer
        totalElements:
          type: integer
      type: object
    responses.VerifyAuthResponse:
      properties:
        expiresAt:
          type: string
        token:
          type: string
      type: object
  securitySchemes:
    BearerAuth:
      in: header
      name: Authorization
      type: apiKey
externalDocs:
  description: ""
  url: ""
info:
  description: This is the API documentation for the Orchestrator.
  title: Orchestrator Host
  version: "1.0"
openapi: 3.1.0
paths:
  /agent-collections:
    get:
      description: Retrieves all available agent collections
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/responses.AgentCollectionResponse'
                type: array
          description: OK
        "500":
          content:
            application/json:
              schema:
                type: string
          description: Internal Server Error
      summary: List agent collections
      tags:
      - agent-collections
  /agent/{agentCollectionAddress}/{agentCollectionTokenId}:
    get:
      description: Retrieves details of a specific agent
      parameters:
      - description: collection address
        in: path
        name: agentCollectionAddress
        required: true
        schema:
          type: string
      - description: token id
        in: path
        name: agentCollectionTokenId
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.AgentResponse'
          description: OK
        "500":
          content:
            application/json:
              schema:
                type: string
          description: Internal Server Error
      summary: Get agent information
      tags:
      - agent
  /agent/{agentCollectionAddress}/{agentCollectionTokenId}/card:
    get:
      description: Returns the live /.well-known/6022 card of the agent's node
      parameters:
      - description: collection address
        in: path
        name: agentCollectionAddress
        required: true
        schema:
          type: string
      - description: token id
        in: path
        name: agentCollectionTokenId
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.AgentCardResponse'
          description: OK
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errors.NotFoundError'
          description: Not Found
        "502":
          content:
            application/json:
              schema:
                type: string
          description: Bad Gateway
      security:
      - BearerAuth: []
      summary: Get agent node card
      tags:
      - agent
  /agent/{agentCollectionAddress}/{agentCollectionTokenId}/prompt-template/{key}:
    get:
      parameters:
      - description: collection address
        in: path
        name: agentCollectionAddress
        required: true
        schema:
          type: string
      - description: token id
        in: path
        name: agentCollectionTokenId
        required: true
        schema:
          type: string
      - description: template key
        in: path
        name: key
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.AgentPromptTemplateResponse'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errors.ValidationError'
          description: Bad Request
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errors.NotFoundError'
          description: Not Found
        "500":
          content:
            application/json:
              schema:
                type: string
          description: Internal Server Error
      security:
      - BearerAuth: []
      summary: Get agent prompt template
      tags:
      - agent
    post:
      parameters:
      - description: collection address
        in: path
        name: agentCollectionAddress
        required: true
        schema:
          type: string
      - description: token id
        in: path
        name: agentCollectionTokenId
        required: true
        schema:
          type: string
      - description: template key
        in: path
        name: key
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/requests.SaveAgentPromptTemplateRequest'
                description: template content
                summary: request
        description: template content
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.AgentPromptTemplateResponse'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errors.ValidationError'
          description: Bad Request
        "500":
          content:
            application/json:
              schema:
                type: string
          description: Internal Server Error
      security:
      - BearerAuth: []
      summary: Save agent prompt template
      tags:
      - agent
  /agents:
    get:
      description: Returns all agents synced from the chain
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ListAgentsResponse'
          description: OK
        "500":
          content:
            application/json:
              schema:
                type: string
          description: Internal Server Error
      summary: List agents
      tags:
      - agent
  /auth/challenge:
    get:
      description: Returns a single-use nonce the wallet must sign
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.GetAuthChallengeResponse'
          description: OK
        "500":
          content:
            application/json:
              schema:
                type: string
          description: Internal Server Error
      summary: Get authentication challenge
      tags:
      - authentication
  /auth/verify:
    post:
      description: Verifies the signed nonce and returns a JWT token
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/requests.VerifyAuthRequest'
                description: verify request
                summary: request
        description: verify request
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.VerifyAuthResponse'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errors.ValidationError'
          description: Bad Request
        "500":
          content:
            application/json:
              schema:
                type: string
          description: Internal Server Error
      summary: Verify signed challenge
      tags:
      - authentication
  /config:
    get:
      description: The EVM chain config (keyed by chain id) the console boots from
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.BlockchainConfigResponse'
          description: OK
        "500":
          content:
            application/json:
              schema:
                type: string
          description: Internal Server Error
      summary: Public chain config
      tags:
      - config
  /conversations:
    get:
      parameters:
      - description: Page
        in: query
        name: page
        schema:
          type: integer
      - description: Elements per page
        in: query
        name: elementsPerPage
        schema:
          type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ListBrokerConversationsResponse'
          description: OK
        "500":
          content:
            application/json:
              schema:
                type: string
          description: Internal Server Error
      security:
      - BearerAuth: []
      summary: List conversations
      tags:
      - conversation
  /conversations/{id}:
    get:
      parameters:
      - description: Conversation ID
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.BrokerConversationResponse'
          description: OK
        "500":
          content:
            application/json:
              schema:
                type: string
          description: Internal Server Error
      security:
      - BearerAuth: []
      summary: Get conversation
      tags:
      - conversation
  /conversations/{id}/force-conclude:
    post:
      parameters:
      - description: Conversation ID
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "204":
          content:
            application/json:
              schema:
                type: string
          description: No Content
        "500":
          content:
            application/json:
              schema:
                type: string
          description: Internal Server Error
      security:
      - BearerAuth: []
      summary: Force conclude a conversation
      tags:
      - conversation
  /conversations/{id}/messages:
    get:
      parameters:
      - description: Conversation ID
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/responses.BrokerMessageResponse'
                type: array
          description: OK
        "500":
          content:
            application/json:
              schema:
                type: string
          description: Internal Server Error
      security:
      - BearerAuth: []
      summary: Get conversation messages
      tags:
      - conversation
  /conversations/{id}/participants:
    get:
      parameters:
      - description: Conversation ID
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/responses.BrokerParticipantResponse'
                type: array
          description: OK
        "500":
          content:
            application/json:
              schema:
                type: string
          description: Internal Server Error
      security:
      - BearerAuth: []
      summary: List conversation participants
      tags:
      - conversation
  /ping:
    get:
      description: Returns "pong" if the service is running
      responses:
        "200":
          content:
            text/plain:
              schema:
                type: string
          description: pong
      summary: Health check endpoint
      tags:
      - health
  /wallet/verify-for-bridge:
    post:
      description: Verify wallet ownership for platform bridge
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/requests.VerifyWalletForBridgeRequest'
              description: wallet verification request
              summary: request
          multipart/form-data:
            schema:
              type: object
        description: wallet verification request
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                type: string
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errors.ValidationError'
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                type: string
          description: Unauthorized
        "500":
          content:
            application/json:
              schema:
                type: string
          description: Internal Server Error
      security:
      - BearerAuth: []
      summary: verify wallet for bridge
      tags:
      - wallet
servers:
- url: /
