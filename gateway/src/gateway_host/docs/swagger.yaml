basePath: /
definitions:
  enums.AgentRole:
    enum:
    - clone
    - human
    - expert
    - facilitator
    type: string
    x-enum-varnames:
    - AgentRoleClone
    - AgentRoleHuman
    - AgentRoleExpert
    - AgentRoleFacilitator
  enums.BridgePlatform:
    enum:
    - slack
    type: string
    x-enum-varnames:
    - BridgePlatformSlack
  errors.ValidationError:
    properties:
      field:
        type: string
      message:
        type: string
    type: object
  requests.ListAgentSortBy:
    enum:
    - name
    - owner
    - createdAt
    - walletAddress
    - collectionAddress
    type: string
    x-enum-varnames:
    - ListAgentSortByName
    - ListAgentSortByOwner
    - ListAgentSortByCreatedAt
    - ListAgentSortByWalletAddress
    - ListAgentSortByCollectionAddress
  requests.SortDirection:
    enum:
    - asc
    - desc
    type: string
    x-enum-varnames:
    - SortDirectionAsc
    - SortDirectionDesc
  requests.VerifyAuthRequest:
    properties:
      address:
        type: string
      nonce:
        type: string
      signature:
        type: string
    type: object
  requests.VerifyWalletForBridgeRequest:
    properties:
      challenge:
        type: string
      platform:
        $ref: '#/definitions/enums.BridgePlatform'
      signature:
        type: string
    type: object
  responses.AgentCollectionResponse:
    properties:
      address:
        type: string
      name:
        type: string
      symbol:
        type: string
    type: object
  responses.AgentResponse:
    properties:
      attributes:
        additionalProperties:
          type: string
        type: object
      cloneOf:
        type: integer
      collectionAddress:
        type: string
      collectionTokenId:
        type: integer
      creator:
        type: string
      ensDomain:
        type: string
      id:
        type: string
      images:
        additionalProperties:
          type: string
        type: object
      name:
        type: string
      owner:
        type: string
      proposalId:
        type: integer
      role:
        $ref: '#/definitions/enums.AgentRole'
      walletAddress:
        type: string
    type: object
  responses.GetAuthChallengeResponse:
    properties:
      expiresAt:
        type: string
      nonce:
        type: string
    type: object
  responses.ListAgentsResponse:
    properties:
      agents:
        items:
          $ref: '#/definitions/responses.AgentResponse'
        type: array
      elementsPerPage:
        type: integer
      page:
        type: integer
      totalElements:
        type: integer
    type: object
  responses.VerifyAuthResponse:
    properties:
      expiresAt:
        type: string
      token:
        type: string
    type: object
info:
  contact: {}
  description: This is the API documentation for the Orchestrator.
  title: Orchestrator Host
  version: "1.0"
paths:
  /agent-collections:
    get:
      description: Retrieves all available agent collections
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/responses.AgentCollectionResponse'
            type: array
        "500":
          description: Internal Server Error
          schema:
            type: string
      summary: List agent collections
      tags:
      - agent-collections
  /agent/{agentCollectionAddress}/{agentCollectionTokenId}:
    get:
      description: Retrieves details of a specific agent
      parameters:
      - description: collection address
        in: path
        name: agentCollectionAddress
        required: true
        type: string
      - description: token id
        in: path
        name: agentCollectionTokenId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/responses.AgentResponse'
        "500":
          description: Internal Server Error
          schema:
            type: string
      summary: Get agent information
      tags:
      - agent
  /agents:
    get:
      description: Returns all agents managed by the orchestrator
      parameters:
      - in: query
        name: elementsPerPage
        type: integer
      - in: query
        name: page
        type: integer
      - enum:
        - name
        - owner
        - createdAt
        - walletAddress
        - collectionAddress
        in: query
        name: sortBy
        type: string
        x-enum-varnames:
        - ListAgentSortByName
        - ListAgentSortByOwner
        - ListAgentSortByCreatedAt
        - ListAgentSortByWalletAddress
        - ListAgentSortByCollectionAddress
      - enum:
        - asc
        - desc
        in: query
        name: sortDirection
        type: string
        x-enum-varnames:
        - SortDirectionAsc
        - SortDirectionDesc
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/responses.ListAgentsResponse'
        "500":
          description: Internal Server Error
          schema:
            type: string
      summary: List agents
      tags:
      - agent
  /auth/challenge:
    get:
      description: Returns a single-use nonce the wallet must sign
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/responses.GetAuthChallengeResponse'
        "500":
          description: Internal Server Error
          schema:
            type: string
      summary: Get authentication challenge
      tags:
      - authentication
  /auth/verify:
    post:
      consumes:
      - application/json
      description: Verifies the signed nonce and returns a JWT token
      parameters:
      - description: verify request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/requests.VerifyAuthRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/responses.VerifyAuthResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/errors.ValidationError'
        "500":
          description: Internal Server Error
          schema:
            type: string
      summary: Verify signed challenge
      tags:
      - authentication
  /ping:
    get:
      description: Returns "pong" if the service is running
      produces:
      - text/plain
      responses:
        "200":
          description: pong
          schema:
            type: string
      summary: Health check endpoint
      tags:
      - health
  /wallet/verify-for-bridge:
    post:
      consumes:
      - multipart/form-data
      description: Verify wallet ownership for platform bridge
      parameters:
      - description: wallet verification request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/requests.VerifyWalletForBridgeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: string
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/errors.ValidationError'
        "401":
          description: Unauthorized
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: verify wallet for bridge
      tags:
      - wallet
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
