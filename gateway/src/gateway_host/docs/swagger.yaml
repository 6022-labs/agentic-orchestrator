basePath: /
definitions:
  enums.BridgePlatform:
    enum:
    - slack
    type: string
    x-enum-varnames:
    - BridgePlatformSlack
  errors.NotFoundError:
    properties:
      message:
        type: string
    type: object
  errors.UnauthorizedError:
    properties:
      code:
        type: string
      message:
        type: string
    type: object
  errors.ValidationError:
    properties:
      field:
        type: string
      message:
        type: string
    type: object
  requests.SaveAgentPromptTemplateRequest:
    properties:
      agentCollectionAddress:
        type: string
      agentCollectionTokenId:
        type: string
      content:
        type: string
      key:
        type: string
    type: object
  requests.VerifyAuthRequest:
    properties:
      address:
        type: string
      signature:
        type: string
    type: object
  requests.VerifyWalletForBridgeRequest:
    properties:
      challenge:
        type: string
      platform:
        $ref: '#/definitions/enums.BridgePlatform'
      signature:
        type: string
    type: object
  responses.AgentCardEndpointsResponse:
    properties:
      chatCompletions:
        type: string
      responses:
        type: string
    type: object
  responses.AgentCardResponse:
    properties:
      endpoints:
        $ref: '#/definitions/responses.AgentCardEndpointsResponse'
      ensDomain:
        type: string
      name:
        type: string
      paymentMethods:
        items:
          type: string
        type: array
      protocol:
        type: string
      protocolVersion:
        type: string
    type: object
  responses.AgentCollectionResponse:
    properties:
      address:
        type: string
      name:
        type: string
      symbol:
        type: string
    type: object
  responses.AgentPromptTemplateResponse:
    properties:
      collectionAddress:
        type: string
      collectionTokenId:
        type: integer
      content:
        type: string
      key:
        type: string
    type: object
  responses.AgentResponse:
    properties:
      addresses:
        additionalProperties:
          type: string
        type: object
      attributes:
        additionalProperties:
          type: string
        type: object
      cloneOf:
        type: integer
      collectionAddress:
        type: string
      collectionTokenId:
        type: integer
      creator:
        type: string
      ensDomain:
        type: string
      id:
        type: string
      images:
        additionalProperties:
          type: string
        type: object
      name:
        type: string
      owner:
        type: string
      proposalId:
        type: integer
    type: object
  responses.AgentUrlResponse:
    properties:
      url:
        type: string
    type: object
  responses.BrokerConversationResponse:
    properties:
      bridgeId:
        type: string
      concludedAt:
        type: string
      createdAt:
        type: string
      description:
        type: string
      id:
        type: string
      status:
        type: string
      updatedAt:
        type: string
    type: object
  responses.BrokerMessageResponse:
    properties:
      content:
        type: string
      conversationId:
        type: string
      createdAt:
        type: string
      id:
        type: string
      participantId:
        type: string
    type: object
  responses.BrokerParticipantResponse:
    properties:
      collectionAddress:
        type: string
      collectionTokenId:
        type: integer
      displayName:
        type: string
      ensDomain:
        type: string
      id:
        type: string
      role:
        type: string
    type: object
  responses.ConfigResponse:
    properties:
      evmChains:
        additionalProperties:
          $ref: '#/definitions/responses.EvmChainConfig'
        type: object
      ipfsGatewayUrlTemplates:
        items:
          type: string
        type: array
      orchestratorAddress:
        type: string
    type: object
  responses.EvmChainConfig:
    properties:
      collectionCreatorAddress:
        type: string
      collectionsManagerAddress:
        type: string
      scannerBaseUrl:
        type: string
    type: object
  responses.GetAuthChallengeResponse:
    properties:
      expiresAt:
        type: string
      message:
        type: string
    type: object
  responses.ListAgentsResponse:
    properties:
      agents:
        items:
          $ref: '#/definitions/responses.AgentResponse'
        type: array
      elementsPerPage:
        type: integer
      page:
        type: integer
      totalElements:
        type: integer
    type: object
  responses.ListBrokerConversationsResponse:
    properties:
      conversations:
        items:
          $ref: '#/definitions/responses.BrokerConversationResponse'
        type: array
      elementsPerPage:
        type: integer
      page:
        type: integer
      totalElements:
        type: integer
    type: object
  responses.VerifyAuthResponse:
    properties:
      expiresAt:
        type: string
      token:
        type: string
    type: object
info:
  contact: {}
  description: This is the API documentation for the Orchestrator.
  title: Orchestrator Host
  version: "1.0"
paths:
  /agent-collections:
    get:
      description: Retrieves all available agent collections
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/responses.AgentCollectionResponse'
            type: array
        "500":
          description: Internal Server Error
          schema:
            type: string
      summary: List agent collections
      tags:
      - agent-collections
  /agent/{agentCollectionAddress}/{agentCollectionTokenId}:
    get:
      description: Retrieves details of a specific agent
      parameters:
      - description: collection address
        in: path
        name: agentCollectionAddress
        required: true
        type: string
      - description: token id
        in: path
        name: agentCollectionTokenId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/responses.AgentResponse'
        "500":
          description: Internal Server Error
          schema:
            type: string
      summary: Get agent information
      tags:
      - agent
  /agent/{agentCollectionAddress}/{agentCollectionTokenId}/card:
    get:
      description: Returns the live /.well-known/6022 card of the agent's node
      parameters:
      - description: collection address
        in: path
        name: agentCollectionAddress
        required: true
        type: string
      - description: token id
        in: path
        name: agentCollectionTokenId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/responses.AgentCardResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/errors.NotFoundError'
        "502":
          description: Bad Gateway
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Get agent node card
      tags:
      - agent
  /agent/{agentCollectionAddress}/{agentCollectionTokenId}/prompt-template/{key}:
    get:
      parameters:
      - description: collection address
        in: path
        name: agentCollectionAddress
        required: true
        type: string
      - description: token id
        in: path
        name: agentCollectionTokenId
        required: true
        type: string
      - description: template key
        in: path
        name: key
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/responses.AgentPromptTemplateResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/errors.ValidationError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/errors.NotFoundError'
        "500":
          description: Internal Server Error
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Get agent prompt template
      tags:
      - agent
    post:
      consumes:
      - application/json
      parameters:
      - description: collection address
        in: path
        name: agentCollectionAddress
        required: true
        type: string
      - description: token id
        in: path
        name: agentCollectionTokenId
        required: true
        type: string
      - description: template key
        in: path
        name: key
        required: true
        type: string
      - description: template content
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/requests.SaveAgentPromptTemplateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/responses.AgentPromptTemplateResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/errors.ValidationError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/errors.NotFoundError'
        "500":
          description: Internal Server Error
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Save agent prompt template
      tags:
      - agent
  /agent/{agentCollectionAddress}/{agentCollectionTokenId}/url:
    get:
      description: Returns the agent node's URL resolved from its ENS url text record
      parameters:
      - description: collection address
        in: path
        name: agentCollectionAddress
        required: true
        type: string
      - description: token id
        in: path
        name: agentCollectionTokenId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/responses.AgentUrlResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/errors.NotFoundError'
        "502":
          description: Bad Gateway
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Get agent node url
      tags:
      - agent
  /agents:
    get:
      description: Returns all agents synced from the chain
      parameters:
      - description: Page number
        in: query
        name: page
        type: integer
      - description: Elements per page
        in: query
        name: elementsPerPage
        type: integer
      - description: Sort direction (asc, desc)
        in: query
        name: sortDirection
        type: string
      - description: Sort by field
        in: query
        name: sortBy
        type: string
      - description: Filter on mint state (true = minted only, false = proposals only)
        in: query
        name: isMinted
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/responses.ListAgentsResponse'
        "500":
          description: Internal Server Error
          schema:
            type: string
      summary: List agents
      tags:
      - agent
  /auth/challenge:
    get:
      description: Returns a single-use EIP-4361 message + expiry the wallet must
        sign verbatim
      parameters:
      - description: wallet address the message is issued for
        in: query
        name: address
        required: true
        type: string
      - description: chain id of the connected wallet
        in: query
        name: chainId
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/responses.GetAuthChallengeResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/errors.ValidationError'
        "500":
          description: Internal Server Error
          schema:
            type: string
      summary: Get authentication challenge
      tags:
      - authentication
  /auth/verify:
    post:
      consumes:
      - application/json
      description: Verifies the signed EIP-4361 message for the nonce and returns
        a JWT token
      parameters:
      - description: verify request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/requests.VerifyAuthRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/responses.VerifyAuthResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/errors.ValidationError'
        "401":
          description: challenge_not_found | signature_mismatch
          schema:
            $ref: '#/definitions/errors.UnauthorizedError'
        "500":
          description: Internal Server Error
          schema:
            type: string
      summary: Verify signed challenge
      tags:
      - authentication
  /config:
    get:
      description: The chain config (keyed by chain id) and IPFS gateways the console
        boots from
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/responses.ConfigResponse'
        "500":
          description: Internal Server Error
          schema:
            type: string
      summary: Public node config
      tags:
      - config
  /conversations:
    get:
      parameters:
      - description: Page
        in: query
        name: page
        type: integer
      - description: Elements per page
        in: query
        name: elementsPerPage
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/responses.ListBrokerConversationsResponse'
        "500":
          description: Internal Server Error
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: List conversations
      tags:
      - conversation
  /conversations/{id}:
    get:
      parameters:
      - description: Conversation ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/responses.BrokerConversationResponse'
        "500":
          description: Internal Server Error
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Get conversation
      tags:
      - conversation
  /conversations/{id}/force-conclude:
    post:
      parameters:
      - description: Conversation ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Force conclude a conversation
      tags:
      - conversation
  /conversations/{id}/messages:
    get:
      parameters:
      - description: Conversation ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/responses.BrokerMessageResponse'
            type: array
        "500":
          description: Internal Server Error
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Get conversation messages
      tags:
      - conversation
  /conversations/{id}/participants:
    get:
      parameters:
      - description: Conversation ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/responses.BrokerParticipantResponse'
            type: array
        "500":
          description: Internal Server Error
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: List conversation participants
      tags:
      - conversation
  /ping:
    get:
      description: Returns "pong" if the service is running
      produces:
      - text/plain
      responses:
        "200":
          description: pong
          schema:
            type: string
      summary: Health check endpoint
      tags:
      - health
  /wallet/verify-for-bridge:
    post:
      consumes:
      - multipart/form-data
      description: Verify wallet ownership for platform bridge
      parameters:
      - description: wallet verification request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/requests.VerifyWalletForBridgeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: string
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/errors.ValidationError'
        "401":
          description: Unauthorized
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: verify wallet for bridge
      tags:
      - wallet
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
