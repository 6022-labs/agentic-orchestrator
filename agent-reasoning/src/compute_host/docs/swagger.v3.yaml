components:
  schemas:
    enums.LLMConnectionPlatform:
      enum:
      - x
      - mistral
      - open-ai
      - libert-ai
      - ollama
      - deepseek
      - anthropic
      - amazon-bedrock
      type: string
      x-enum-comments:
        LLMConnectionPlatformX: Twitter
      x-enum-varnames:
      - LLMConnectionPlatformX
      - LLMConnectionPlatformMistral
      - LLMConnectionPlatformOpenAI
      - LLMConnectionPlatformLibertAI
      - LLMConnectionPlatformOllama
      - LLMConnectionPlatformDeepseek
      - LLMConnectionPlatformAnthropic
      - LLMConnectionPlatformAmazonBedrock
    enums.LLMConnectionSetupStatus:
      enum:
      - established
      type: string
      x-enum-varnames:
      - LLMConnectionSetupStatusEstablished
    errors.ValidationError:
      properties:
        field:
          type: string
        message:
          type: string
      type: object
    models.ChatCompletionMessage:
      properties:
        content:
          type: string
        role:
          type: string
      type: object
    requests.AgentIdRequest:
      properties:
        agentId:
          type: string
      type: object
    requests.CreateMCPConnectionRequest:
      properties:
        agentId:
          type: string
        headerAuth:
          additionalProperties:
            type: string
          type: object
        name:
          type: string
        url:
          type: string
      type: object
    requests.IdRequest:
      properties:
        id:
          type: string
      type: object
    requests.LLMConnectionChatCompletionRequest:
      properties:
        agentId:
          type: string
        messages:
          items:
            $ref: '#/components/schemas/models.ChatCompletionMessage'
          type: array
          uniqueItems: false
      type: object
    requests.SaveLLMConnectionRequest:
      properties:
        agentId:
          type: string
        amazonPlatformRegion:
          type: string
        apiKey:
          type: string
        baseUrl:
          type: string
        model:
          type: string
        platform:
          $ref: '#/components/schemas/enums.LLMConnectionPlatform'
      type: object
    responses.GetLLMConnectionSettingsResponse:
      properties:
        baseUrl:
          type: string
        model:
          type: string
        platform:
          $ref: '#/components/schemas/enums.LLMConnectionPlatform'
      type: object
    responses.GetLLMConnectionSetupStatusResponse:
      properties:
        isCompleted:
          type: boolean
        setupStatus:
          $ref: '#/components/schemas/enums.LLMConnectionSetupStatus'
      type: object
    responses.ListMCPConnectionsResponse:
      properties:
        elementsPerPage:
          type: integer
        mcpConnections:
          items:
            $ref: '#/components/schemas/responses.MCPConnectionResponse'
          type: array
          uniqueItems: false
        page:
          type: integer
        totalElements:
          type: integer
      type: object
    responses.MCPConnectionResponse:
      properties:
        agentId:
          type: string
        id:
          type: string
        name:
          type: string
        url:
          type: string
      type: object
externalDocs:
  description: ""
  url: ""
info:
  description: This is the API documentation for the Orchestrator Agent LLM Connector.
  title: Orchestrator Agent LLM Connector Host API
  version: "1.0"
openapi: 3.1.0
paths:
  /chat/completion:
    post:
      description: Handles chat completion requests
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/requests.LLMConnectionChatCompletionRequest'
                description: Chat Completion Request
                summary: request
        description: Chat Completion Request
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                type: string
          description: Chat Completion Response
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errors.ValidationError'
          description: Bad Request
        "500":
          content:
            application/json:
              schema:
                type: string
          description: Internal Server Error
      summary: Chat Completion
      tags:
      - Chat Completion
  /llm/connection:
    delete:
      description: Removes an existing LLM connection
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/requests.AgentIdRequest'
                description: Remove LLM Connection Request
                summary: request
        description: Remove LLM Connection Request
        required: true
      responses:
        "204":
          content:
            application/json:
              schema:
                type: string
          description: No Content
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errors.ValidationError'
          description: Bad Request
        "500":
          content:
            application/json:
              schema:
                type: string
          description: Internal Server Error
      summary: Remove LLM Connection
      tags:
      - LLM Connection
    post:
      description: Creates or update a LLM connection based on the agent id
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/requests.SaveLLMConnectionRequest'
                description: Save LLM Connection Request
                summary: request
        description: Save LLM Connection Request
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                type: string
          description: Saved
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errors.ValidationError'
          description: Bad Request
        "500":
          content:
            application/json:
              schema:
                type: string
          description: Internal Server Error
      summary: Save LLM Connection
      tags:
      - LLM Connection
  /llm/connection/settings:
    get:
      description: Retrieves settings for an LLM connection
      parameters:
      - in: query
        name: agentId
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.GetLLMConnectionSettingsResponse'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errors.ValidationError'
          description: Bad Request
        "500":
          content:
            application/json:
              schema:
                type: string
          description: Internal Server Error
      summary: Get LLM Connection Settings
      tags:
      - LLM Connection
  /llm/connection/setup-status:
    get:
      description: Retrieves the setup status for an LLM connection
      parameters:
      - in: query
        name: agentId
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.GetLLMConnectionSetupStatusResponse'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errors.ValidationError'
          description: Bad Request
        "500":
          content:
            application/json:
              schema:
                type: string
          description: Internal Server Error
      summary: Get LLM Connection Setup Status
      tags:
      - LLM Connection
  /mcp/connection:
    delete:
      description: Removes an existing MCP connection
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/requests.IdRequest'
                description: Remove MCP Connection Request
                summary: request
        description: Remove MCP Connection Request
        required: true
      responses:
        "204":
          content:
            application/json:
              schema:
                type: string
          description: No Content
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errors.ValidationError'
          description: Bad Request
        "500":
          content:
            application/json:
              schema:
                type: string
          description: Internal Server Error
      summary: Remove MCP Connection
      tags:
      - MCP Connection
    post:
      description: Creates a new MCP connection
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/requests.CreateMCPConnectionRequest'
                description: Create MCP Connection Request
                summary: request
        description: Create MCP Connection Request
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                type: string
          description: Created
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errors.ValidationError'
          description: Bad Request
        "500":
          content:
            application/json:
              schema:
                type: string
          description: Internal Server Error
      summary: Create MCP Connection
      tags:
      - MCP Connection
  /mcp/connections:
    get:
      description: Retrieves a list of MCP connections for the given agent
      requestBody:
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ListMCPConnectionsResponse'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errors.ValidationError'
          description: Bad Request
        "500":
          content:
            application/json:
              schema:
                type: string
          description: Internal Server Error
      summary: List MCP Connections
      tags:
      - MCP Connection
servers:
- url: /
