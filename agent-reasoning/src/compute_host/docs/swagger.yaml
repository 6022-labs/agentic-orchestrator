basePath: /
definitions:
  enums.LLMConnectionPlatform:
    enum:
    - x
    - mistral
    - open-ai
    - libert-ai
    - ollama
    - deepseek
    - anthropic
    - amazon-bedrock
    type: string
    x-enum-comments:
      LLMConnectionPlatformX: Twitter
    x-enum-varnames:
    - LLMConnectionPlatformX
    - LLMConnectionPlatformMistral
    - LLMConnectionPlatformOpenAI
    - LLMConnectionPlatformLibertAI
    - LLMConnectionPlatformOllama
    - LLMConnectionPlatformDeepseek
    - LLMConnectionPlatformAnthropic
    - LLMConnectionPlatformAmazonBedrock
  enums.LLMConnectionSetupStatus:
    enum:
    - established
    type: string
    x-enum-varnames:
    - LLMConnectionSetupStatusEstablished
  errors.ValidationError:
    properties:
      field:
        type: string
      message:
        type: string
    type: object
  models.ChatCompletionMessage:
    properties:
      content:
        type: string
      role:
        type: string
    type: object
  requests.AgentIdRequest:
    properties:
      agentId:
        type: string
    type: object
  requests.CreateMCPConnectionRequest:
    properties:
      agentId:
        type: string
      headerAuth:
        additionalProperties:
          type: string
        type: object
      name:
        type: string
      url:
        type: string
    type: object
  requests.IdRequest:
    properties:
      id:
        type: string
    type: object
  requests.LLMConnectionChatCompletionRequest:
    properties:
      agentId:
        type: string
      messages:
        items:
          $ref: '#/definitions/models.ChatCompletionMessage'
        type: array
    type: object
  requests.ListAgentMCPConnectionsSortBy:
    enum:
    - url
    - name
    type: string
    x-enum-varnames:
    - ListAgentMCPConnectionsSortByUrl
    - ListAgentMCPConnectionsSortByName
  requests.SaveLLMConnectionRequest:
    properties:
      agentId:
        type: string
      amazonPlatformRegion:
        type: string
      apiKey:
        type: string
      host:
        type: string
      model:
        type: string
      platform:
        $ref: '#/definitions/enums.LLMConnectionPlatform'
      port:
        type: string
    type: object
  requests.SortDirection:
    enum:
    - asc
    - desc
    type: string
    x-enum-varnames:
    - SortDirectionAsc
    - SortDirectionDesc
  responses.GetLLMConnectionSettingsResponse:
    properties:
      host:
        type: string
      model:
        type: string
      platform:
        $ref: '#/definitions/enums.LLMConnectionPlatform'
    type: object
  responses.GetLLMConnectionSetupStatusResponse:
    properties:
      isCompleted:
        type: boolean
      setupStatus:
        $ref: '#/definitions/enums.LLMConnectionSetupStatus'
    type: object
  responses.ListMCPConnectionsResponse:
    properties:
      elementsPerPage:
        type: integer
      mcpConnections:
        items:
          $ref: '#/definitions/responses.MCPConnectionResponse'
        type: array
      page:
        type: integer
      totalElements:
        type: integer
    type: object
  responses.MCPConnectionResponse:
    properties:
      agentId:
        type: string
      id:
        type: string
      name:
        type: string
      url:
        type: string
    type: object
info:
  contact: {}
  description: This is the API documentation for the Orchestrator Agent LLM Connector.
  title: Orchestrator Agent LLM Connector Host API
  version: "1.0"
paths:
  /chat/completion:
    post:
      consumes:
      - application/json
      description: Handles chat completion requests
      parameters:
      - description: Chat Completion Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/requests.LLMConnectionChatCompletionRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Chat Completion Response
          schema:
            type: string
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/errors.ValidationError'
        "500":
          description: Internal Server Error
          schema:
            type: string
      summary: Chat Completion
      tags:
      - Chat Completion
  /llm/connection:
    delete:
      consumes:
      - application/json
      description: Removes an existing LLM connection
      parameters:
      - description: Remove LLM Connection Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/requests.AgentIdRequest'
      produces:
      - application/json
      responses:
        "204":
          description: No Content
          schema:
            type: string
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/errors.ValidationError'
        "500":
          description: Internal Server Error
          schema:
            type: string
      summary: Remove LLM Connection
      tags:
      - LLM Connection
    post:
      consumes:
      - application/json
      description: Creates or update a LLM connection based on the agent id
      parameters:
      - description: Save LLM Connection Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/requests.SaveLLMConnectionRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Saved
          schema:
            type: string
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/errors.ValidationError'
        "500":
          description: Internal Server Error
          schema:
            type: string
      summary: Save LLM Connection
      tags:
      - LLM Connection
  /llm/connection/settings:
    get:
      consumes:
      - application/json
      description: Retrieves settings for an LLM connection
      parameters:
      - in: query
        name: agentId
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/responses.GetLLMConnectionSettingsResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/errors.ValidationError'
        "500":
          description: Internal Server Error
          schema:
            type: string
      summary: Get LLM Connection Settings
      tags:
      - LLM Connection
  /llm/connection/setup-status:
    get:
      consumes:
      - application/json
      description: Retrieves the setup status for an LLM connection
      parameters:
      - in: query
        name: agentId
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/responses.GetLLMConnectionSetupStatusResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/errors.ValidationError'
        "500":
          description: Internal Server Error
          schema:
            type: string
      summary: Get LLM Connection Setup Status
      tags:
      - LLM Connection
  /mcp/connection:
    delete:
      consumes:
      - application/json
      description: Removes an existing MCP connection
      parameters:
      - description: Remove MCP Connection Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/requests.IdRequest'
      produces:
      - application/json
      responses:
        "204":
          description: No Content
          schema:
            type: string
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/errors.ValidationError'
        "500":
          description: Internal Server Error
          schema:
            type: string
      summary: Remove MCP Connection
      tags:
      - MCP Connection
    post:
      consumes:
      - application/json
      description: Creates a new MCP connection
      parameters:
      - description: Create MCP Connection Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/requests.CreateMCPConnectionRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            type: string
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/errors.ValidationError'
        "500":
          description: Internal Server Error
          schema:
            type: string
      summary: Create MCP Connection
      tags:
      - MCP Connection
  /mcp/connections:
    get:
      consumes:
      - application/json
      description: Retrieves a list of MCP connections for the given agent
      parameters:
      - in: query
        name: agentId
        type: string
      - in: query
        name: elementsPerPage
        type: integer
      - in: query
        name: page
        type: integer
      - in: query
        name: search
        type: string
      - enum:
        - url
        - name
        in: query
        name: sortBy
        type: string
        x-enum-varnames:
        - ListAgentMCPConnectionsSortByUrl
        - ListAgentMCPConnectionsSortByName
      - enum:
        - asc
        - desc
        in: query
        name: sortDirection
        type: string
        x-enum-varnames:
        - SortDirectionAsc
        - SortDirectionDesc
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/responses.ListMCPConnectionsResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/errors.ValidationError'
        "500":
          description: Internal Server Error
          schema:
            type: string
      summary: List MCP Connections
      tags:
      - MCP Connection
swagger: "2.0"
